name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build v10.3.0 app-only preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re, shutil

          loader = Path('v10-3-0.html').read_text(encoding='utf-8')
          match = re.search(r"const b64='([^']+)'", loader, re.S)
          if not match:
              raise SystemExit('v10.3.0 payload not found')

          html = gzip.decompress(base64.b64decode(match.group(1))).decode('utf-8')

          # Remove the simulator-only stylesheet when present.
          html = re.sub(
              r'\n?<style id="simulator-1290x2796">[\s\S]*?</style>\n?',
              '\n',
              html,
              count=1,
          )

          # Keep the v10.3.0 product UI/JS untouched. Force any remaining
          # simulator containers to become transparent full-viewport wrappers.
          css = r'''
          <style id="v10-3-0-app-only-public">
          html,body{
            width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;
            overflow:hidden!important;background:#050505!important;
          }
          body{display:block!important;position:fixed!important;inset:0!important}
          :root{
            --safe-top:env(safe-area-inset-top,0px)!important;
            --safe-bottom:env(safe-area-inset-bottom,0px)!important;
          }
          .device-stage,.device-shell,.phone,.screen{
            position:fixed!important;inset:0!important;
            width:100vw!important;height:100vh!important;height:100dvh!important;
            max-width:none!important;max-height:none!important;
            margin:0!important;padding:0!important;border:0!important;border-radius:0!important;
            overflow:hidden!important;background:#050505!important;
            box-shadow:none!important;transform:none!important;
          }
          .device-stage,.device-shell{display:block!important}
          .screen{container-type:inline-size!important}
          .app{position:absolute!important;inset:0!important;width:100%!important;height:100%!important}
          .status-lock{display:none!important}
          .topbar{top:var(--safe-top)!important}
          .bottom{padding-bottom:var(--safe-bottom)!important}
          @supports not (height:100dvh){.device-stage,.device-shell,.phone,.screen{height:100vh!important}}
          </style>
          '''
          html = html.replace('</head>', css + '\n</head>', 1)
          html = re.sub(
              r'<title>.*?</title>',
              '<title>DIMSPACE Mobile · v10.3.0 · App Only</title>',
              html,
              count=1,
              flags=re.S,
          )

          # Remove any old PWA/service-worker state after the new page loads.
          cleanup = r'''
          <script>
          if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
          if('caches' in window){caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});}
          </script>
          '''
          html = html.replace('</body>', cleanup + '\n</body>', 1)

          dist = Path('dist')
          if dist.exists(): shutil.rmtree(dist)
          dist.mkdir()
          (dist/'index.html').write_text(html, encoding='utf-8')
          (dist/'v10-3-0-app-content.html').write_text(html, encoding='utf-8')
          for name in ['icon.svg','manifest.webmanifest','.nojekyll']:
              src=Path(name)
              if src.exists(): shutil.copy2(src, dist/name)

          print('Built app-only v10.3.0:', len(html), 'bytes')
          print('Contains heart metric:', 'media-footer' in html)
          print('Contains old fallback:', 'product.html?v=1031' in html)
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
