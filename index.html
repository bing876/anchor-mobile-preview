<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIMSPACE Mobile · Phone Preview v7.5</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080809}
body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.stage{width:100%;height:100%;display:grid;place-items:center;background:#080809}
.phone-shell{position:relative;width:min(92vw,380px);aspect-ratio:330/690;border-radius:55px;padding:12px;background:#171719;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 34px 92px rgba(0,0,0,.60)}
.phone-screen{position:absolute;inset:12px;border-radius:43px;overflow:hidden;background:#050505}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050505}
@media(max-height:760px){.phone-shell{width:min(80vw,330px)}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone-shell">
    <div class="phone-screen">
      <iframe src="./product.html" title="DIMSPACE Mobile v7.5"></iframe>
    </div>
  </div>
</div>
</body>
</html>
