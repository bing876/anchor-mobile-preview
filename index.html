<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="./anchor-logo.svg">
<title>DIMSPACE Mobile · v3.3</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;overflow:hidden}
body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
#state{font-size:13px;opacity:.55}
</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
<div id="state">DIMSPACE Mobile · 正在加载</div>
<script>
(async()=>{
  const state=document.getElementById('state');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if(!window.pako) throw new Error('pako unavailable');

    const r=await fetch('./v33/payload.b64?v=33-smart-recovery',{cache:'no-store'});
    if(!r.ok) throw new Error('payload '+r.status);
    const b64=(await r.text()).trim();
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const html=new TextDecoder('utf-8').decode(window.pako.ungzip(bytes));

    if(!html.includes('v3.3 Git Preview') || !html.includes('SMART TWO-COLUMN') && !html.includes('Smart Two-Column')){
      console.warn('preview signature fallback check');
    }

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    if(state) state.textContent='DIMSPACE Mobile 加载失败，请刷新';
  }
})();
</script>
</body>
</html>
