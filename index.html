<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#060607" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="锚点" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<title>锚点 Mobile Preview</title>
<style>
:root{
  --bg:#060607;
  --bg2:#030304;
  --fg:#f5f5f7;
  --muted:#a9abb1;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --nav-h:44px;
  --touch:44px;
  --side:11.4px;
  --menu-icon:24.3px;
  --search-icon:25.8px;
  --tabs-gap:20px;
  --tab-size:16.7px;
  --bottom-core:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit}
.app{
  position:fixed;inset:0;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
.topbar{
  position:absolute;
  top:env(safe-area-inset-top);left:0;right:0;
  height:var(--nav-h);
  background:var(--bg);
  z-index:20;
}
.top-left,.top-right{position:absolute;top:0;height:100%;display:flex;align-items:center;z-index:2}
.top-left{left:var(--side)}
.top-right{right:var(--side)}
.icon-btn{
  appearance:none;border:0;background:transparent;color:#fff;
  width:var(--touch);height:var(--touch);padding:0;margin:0;
  display:grid;place-items:center;border-radius:14px;
}
.icon-btn:active{transform:scale(.96);opacity:.82;background:rgba(255,255,255,.055)}
.icon-btn.menu svg{width:var(--menu-icon);height:var(--menu-icon)}
.icon-btn.search svg{width:var(--search-icon);height:var(--search-icon)}
.tabs{
  position:absolute;left:60px;right:60px;top:0;height:100%;
  display:flex;align-items:center;gap:var(--tabs-gap);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;overscroll-behavior-x:contain;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;border:0;background:transparent;color:var(--muted);
  padding:0;height:100%;display:inline-flex;align-items:center;flex:0 0 auto;
  font-size:var(--tab-size);font-weight:650;line-height:1;white-space:nowrap;
  transition:color .14s ease,opacity .14s ease;opacity:.92;scroll-snap-align:center;
}
.tab.active{color:#fff;opacity:1}
.content{
  position:absolute;
  top:calc(env(safe-area-inset-top) + var(--nav-h));
  left:0;right:0;
  bottom:calc(var(--bottom-core) + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
}
.bottom{
  position:absolute;left:0;right:0;bottom:0;
  height:calc(var(--bottom-core) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--bg);
  display:grid;grid-template-columns:repeat(5,1fr);
  z-index:30;
}
.bottom button{appearance:none;border:0;background:transparent;color:#969696;padding:0;margin:0}
.bottom .nav.active{color:#fff}
.nav{position:relative;height:var(--bottom-core)}
.nav span{position:absolute;top:13px;left:0;right:0;text-align:center;font-size:16.6px;font-weight:600;line-height:1}
.center{height:var(--bottom-core);display:flex;justify-content:center;align-items:flex-start;padding-top:11.7px}
.center svg{width:38.9px;height:31.2px}
.center:active svg{transform:scale(.94);opacity:.88}
@media (max-width:390px){
  :root{--tab-size:15px;--tabs-gap:17px}
  .tabs{left:54px;right:54px}
  .nav span{font-size:14px}
}
</style>
</head>
<body>
<section class="app" aria-label="锚点 Mobile Preview">
  <header class="topbar">
    <div class="top-left">
      <button class="icon-btn menu" aria-label="菜单" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6.5H20M4 12H20M4 17.5H16.5" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="tabs" aria-label="顶部分类">
      <button class="tab active" data-tabtop="recommend" type="button">推荐</button>
      <button class="tab" data-tabtop="work" type="button">工作</button>
      <button class="tab" data-tabtop="study" type="button">学习</button>
      <button class="tab" data-tabtop="create" type="button">创作</button>
      <button class="tab" data-tabtop="life" type="button">生活</button>
      <button class="tab" data-tabtop="explore" type="button">探索</button>
    </div>
    <div class="top-right">
      <button class="icon-btn search" aria-label="搜索" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3" stroke="currentColor" stroke-width="2.1"/><path d="M15.6 15.6L19.7 19.7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="content"></main>

  <nav class="bottom" aria-label="底部导航">
    <button class="nav active" data-bottom="home" type="button"><span>首页</span></button>
    <button class="nav" data-bottom="daily" type="button"><span>日常</span></button>
    <button class="center" type="button" aria-label="添加">
      <svg viewBox="0 0 27.2 21.829" aria-hidden="true"><rect x="0.86" y="0.86" width="25.48" height="20.109" rx="5.72" fill="none" stroke="#f7f7f7" stroke-width="1.72"/><path d="M9.68 10.9145H17.52M13.6 6.9945V14.8345" fill="none" stroke="#f7f7f7" stroke-width="2.26" stroke-linecap="round"/></svg>
    </button>
    <button class="nav" data-bottom="messages" type="button"><span>消息</span></button>
    <button class="nav" data-bottom="mine" type="button"><span>我的</span></button>
  </nav>
</section>
<script>
const rail=document.querySelector('.tabs');
document.addEventListener('click',e=>{
  const top=e.target.closest('[data-tabtop]');
  if(top){document.querySelectorAll('[data-tabtop]').forEach(x=>x.classList.toggle('active',x===top));top.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}
  const bottom=e.target.closest('[data-bottom]');
  if(bottom){document.querySelectorAll('[data-bottom]').forEach(x=>x.classList.toggle('active',x===bottom));}
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script>
</body>
</html>
