<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DIMSPACE Mobile · v10.3.0</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;overflow:hidden}
body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
#state{font-size:13px;opacity:.55}
</style>
</head>
<body>
<div id="state">DIMSPACE Mobile · v10.3.0</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }

    const parts=[
      './v103-app/part01.html',
      './v103-app/part02.html',
      './v103-app/part03.html',
      './v103-app/part04.html',
      './v103-app/part05.html',
      './v103-app/part06.html',
      './v103-app/part07.html'
    ];

    const chunks=[];
    for(const url of parts){
      const response=await fetch(url+'?v=1030-final-247b54d',{cache:'no-store'});
      if(!response.ok) throw new Error(url+' '+response.status);
      chunks.push(await response.text());
    }

    const html=chunks.join('');
    if(
      !html.includes('v10-3-0-app-content-only') ||
      !html.includes('media-footer') ||
      !html.includes('FEED_VIEW_COUNTS') ||
      html.includes('device-stage') ||
      html.includes('device-shell')
    ){
      throw new Error('invalid v10.3.0 app-only payload');
    }

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    const state=document.getElementById('state');
    if(state) state.textContent='v10.3.0 加载失败，请刷新';
  }
})();
</script>
</body>
</html>
