<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="./anchor-logo.svg">
<title>DIMSPACE Mobile · v3.3</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;overflow:hidden}
body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
#state{font-size:13px;opacity:.58;padding:20px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div id="state">DIMSPACE Mobile · 正在加载</div>
<script>
(async()=>{
  const state=document.getElementById('state');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }

    const parts=[
      './v33plain/part01.txt',
      './v33plain/part02.txt',
      './v33plain/part03.txt',
      './v33plain/part04.txt',
      './v33plain/part05.txt',
      './v33plain/part06.txt',
      './v33plain/part07a.txt',
      './v33plain/part07b.txt'
    ];

    const chunks=[];
    for(const url of parts){
      const r=await fetch(url+'?v=33-plain-final',{cache:'no-store'});
      if(!r.ok) throw new Error(url+' HTTP '+r.status);
      chunks.push(await r.text());
    }

    const html=chunks.join('');
    if(!html.startsWith('<!doctype html>')) throw new Error('HTML 开头校验失败');
    if(!html.includes('</html>')) throw new Error('HTML 结尾校验失败');
    if(!html.includes('dimspace-star-clear-all-feed-modes')) throw new Error('当前版本校验失败');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    if(state){
      state.innerHTML='DIMSPACE Mobile 加载失败<br><span style="opacity:.72">'+String(err && err.message || err)+'</span>';
    }
  }
})();
</script>
</body>
</html>
