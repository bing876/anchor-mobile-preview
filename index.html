*scale}px`);root.style.setProperty('--sim-battery-font',`${12*scale}px`);root.style.setProperty('--safe-bottom',`${34*scale}px`)}else{root.removeAttribute('data-sim');root.style.removeProperty('--safe-top');root.style.removeProperty('--safe-bottom')}root.dataset.masterWidth=String(MASTER_WIDTH);root.dataset.masterHeight=String(MASTER_HEIGHT);root.dataset.viewportWidth=width.toFixed(2);root.dataset.productScale=scale.toFixed(6)}syncMasterScale();window.addEventListener('resize',syncMasterScale,{passive:true});window.visualViewport?.addEventListener('resize',syncMasterScale,{passive:true});document.addEventListener('click',e=>{const top=e.target.closest('[data-tabtop]');if(top){document.querySelectorAll('[data-tabtop]').forEach(x=>x.classList.toggle('active',x===top));top.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}const bottom=e.target.closest('[data-bottom]');if(bottom)document.querySelectorAll('[data-bottom]').forEach(x=>x.classList.toggle('active',x===bottom))});if('serviceWorker'in navigator)window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('./service-worker.js');reg.update()}catch{}})})();</script></body></html>
