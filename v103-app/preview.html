<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>DIMSPACE Mobile · v10.3.0 App Only</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff}
body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
#state{font-size:13px;opacity:.55}
</style>
</head>
<body>
<div id="state">DIMSPACE Mobile · v10.3.0</div>
<script>
(async()=>{
  try{
    const parts=['part01.html','part02.html','part03.html','part04.html','part05.html','part06.html','part07.html'];
    const chunks=[];
    for(const file of parts){
      const r=await fetch('./'+file+'?v=1030-final-direct',{cache:'no-store'});
      if(!r.ok) throw new Error(file+' '+r.status);
      chunks.push(await r.text());
    }
    const html=chunks.join('');
    if(!html.includes('v10-3-0-app-content-only')||!html.includes('media-footer')||!html.includes('FEED_VIEW_COUNTS')||html.includes('device-stage')||html.includes('device-shell')) throw new Error('invalid app-only payload');
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);
    document.getElementById('state').textContent='v10.3.0 加载失败，请刷新';
  }
})();
</script>
</body>
</html>
